<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/favicon.png" />
<title>Contact | Sprig</title>
<meta name="description" content="Get in touch with the Sprig team." />
<link rel="stylesheet" href="/css/site.css" />
<style>
.contact-main{max-width:560px;margin:0 auto;padding:28px 0 72px}
</style>
</head>
<body>
<a class="skip" href="#contact-form">Skip to form</a>
<div class="hero-band">
  <div class="wrap">
    <header class="site-header">
      <a class="brand" href="/">
        <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="#1E7A50"/><g fill="#fff"><path d="M48.6 70 L51.4 70 L50.6 85 L49.4 85 Z"/><path d="M50 16 C69 25 77 44 50 72 C23 44 31 25 50 16 Z"/></g><path d="M49.4 26 L50.6 26 L50.3 68 L49.7 68 Z" fill="#1E7A50"/></svg>
        Sprig
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="/#features">Features</a>
        <a href="/#video">Watch</a>
        <a href="/#compare">Compare</a>
        <a href="/#gallery">Screens</a>
        <a href="/switch">Switch &amp; Save</a>
      </nav>
    </header>
  </div>
</div>

<main class="wrap contact-main">
  <div class="page-hero">
    <div class="kicker">Contact</div>
    <h1>Contact us</h1>
    <p class="lead">Questions, suggestions, or something not working right? Use the form below and we will get back to you.</p>
  </div>

  <form class="form-card" id="contact-form">
    <div>
      <label for="email">Your email</label>
      <input type="email" id="email" name="email" placeholder="Your email address" required autocomplete="email">
    </div>
    <div>
      <label for="subject">Subject</label>
      <select id="subject" name="topic" required>
        <option value="" disabled selected>Choose one</option>
        <option value="Help">Help</option>
        <option value="Suggestion">Suggestion</option>
        <option value="Bug Report">Bug Report</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="What's on your mind?" required></textarea>
    </div>
    <input type="text" name="botcheck" id="botcheck" style="display:none" tabindex="-1" autocomplete="off">
    <div class="checkbox-row">
      <input type="checkbox" id="not-robot" required>
      <label for="not-robot" style="margin:0;font-weight:400;color:var(--mute)">I'm not a robot</label>
    </div>
    <input type="hidden" name="access_key" value="1fc601fa-5c96-4ec0-a668-8f9daaada58f">
    <input type="hidden" name="from_name" value="Sprig Contact Form">
    <button class="btn primary full" type="submit" id="submit-btn">Send message</button>
    <p class="status" id="form-status"></p>
  </form>
</main>

<footer class="site-footer">
  <a href="/">Home</a>
  <a href="/privacy">Privacy</a>
  <a href="/terms">Terms</a>
  <a href="/data-retention">Data Retention</a>
  <a href="/contact" aria-current="page">Contact</a>
  <span>© 2026 CoreForge</span>
</footer>

<script>
(function () {
  var form = document.getElementById('contact-form');
  var btn = document.getElementById('submit-btn');
  var status = document.getElementById('form-status');
  var robotCheck = document.getElementById('not-robot');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!robotCheck.checked) {
      status.textContent = "Please confirm you're not a robot.";
      status.className = 'status error';
      return;
    }
    var orig = btn.textContent;
    btn.textContent = 'Sending...';
    btn.disabled = true;
    status.textContent = '';
    status.className = 'status';

    var payload = Object.fromEntries(new FormData(form));
    payload.subject = 'Sprig contact form: ' + payload.topic;
    payload.message = 'Topic: ' + payload.topic + '\n\n' + payload.message;

    fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.success) {
          form.reset();
          form.style.display = 'none';
          status.textContent = "Thanks, we got it. We'll get back to you if needed.";
          status.className = 'status success';
        } else {
          btn.textContent = orig;
          btn.disabled = false;
          status.textContent = "Hmm, that didn't go through. Please try again.";
          status.className = 'status error';
        }
      })
      .catch(function () {
        btn.textContent = orig;
        btn.disabled = false;
        status.textContent = "Hmm, that didn't go through. Please try again.";
        status.className = 'status error';
      });
  });
})();
</script>
</body>
</html>
